name: "Release Automated Pipeline (Tauri v2)"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release Version Tag (e.g. v2.8.0)"
        required: false
        default: "v2.8.0"

permissions:
  contents: write

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            arch_name: "x64"
          - platform: "windows-latest"
            target: "aarch64-pc-windows-msvc"
            arch_name: "arm64"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build

      - name: Build Tauri Desktop Package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.release_version }}
          releaseName: "BurnInX ${{ github.ref_name || inputs.release_version }}"
          releaseBody: |
            ### BurnInX - 硬件压力测试与运行监控平台 (${{ matrix.arch_name }})
            
            🎉 感谢使用 BurnInX 桌面原生版！本版本采用 **Tauri v2** 原生架构构建。
            
            #### 核心亮点：
            - **GPU 3D 渲染压力测试**：经典 FurMark 毛发甜甜圈着色器、未开始时完全待机、开始后解除帧率上限 (Unlimited FPS)。
            - **独立 CPU / 内存压力测试**：多线程 AVX 矩阵乘法/哈希与大内存位翻转坏块检测。
            - **x64 与 ARM64 深度适配**：x64 平台支持 DLSS / DLAA / 帧生成 / 光线重建；ARM64 平台按规范安全禁用并优化功耗。
            - **专业 HTML 诊断报告**：内置矢量图表、热节流预警与单文件 HTML 独立离线导出。
            
            #### 安装包说明：
            - `.msi`: Windows 安装程序包 (Windows Installer)
            - `.exe`: NSIS 单文件/一键安装引导器
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
