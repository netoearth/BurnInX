<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Flame & X Gradient 1 -->
    <linearGradient id="flameGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="35%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Flame & X Gradient 2 -->
    <linearGradient id="flameGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="75%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Inner Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Circuit Trace Color -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#ea580c" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Squircle with Glowing Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" filter="url(#shadow)" />

  <!-- High-Tech Circuit Traces & Benchmark Grid -->
  <path d="M 64 160 L 140 160 L 176 196 M 448 352 L 372 352 L 336 316" stroke="url(#traceGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 160 64 L 160 120 M 352 448 L 352 392" stroke="url(#traceGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
  <circle cx="176" cy="196" r="5" fill="#38bdf8" opacity="0.6" />
  <circle cx="336" cy="316" r="5" fill="#f97316" opacity="0.6" />

  <!-- Center Ambient Flare -->
  <circle cx="256" cy="265" r="150" fill="url(#coreGlow)" />

  <!-- BurnInX Dynamic Emblem: Stylized Flame X -->
  <!-- Left-to-right diagonal arm with flame spikes -->
  <path d="M 124 136 
           C 142 136, 170 160, 204 212 
           L 256 280 
           L 308 212 
           C 342 160, 370 136, 388 136 
           C 402 136, 408 146, 396 164 
           L 308 290 
           L 396 414 
           C 406 428, 398 436, 382 436 
           C 364 436, 338 412, 304 362 
           L 256 298 
           L 208 362 
           C 174 412, 148 436, 130 436 
           C 114 436, 106 428, 116 414 
           L 204 290 
           L 116 164 
           C 104 146, 110 136, 124 136 Z" 
        fill="url(#flameGrad1)" />

  <!-- Central Dynamic Flame Tongue (Rising out from center of X) -->
  <path d="M 256 104
           C 278 152, 298 190, 288 236
           C 282 220, 274 210, 266 204
           C 270 230, 260 256, 240 274
           C 230 248, 236 220, 248 196
           C 256 180, 246 150, 256 104 Z"
        fill="url(#flameGrad2)" />

  <!-- Hot Core Flame Accent -->
  <path d="M 256 160
           C 266 188, 274 212, 268 238
           C 264 228, 258 222, 252 218
           C 254 232, 248 248, 238 258
           C 234 242, 238 226, 246 210
           C 252 198, 250 182, 256 160 Z"
        fill="#ffffff" opacity="0.9" />

  <!-- BurnInX Brand Mark Text "X" subtle micro-badge -->
  <text x="256" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#f59e0b" letter-spacing="4" text-anchor="middle" opacity="0.85">BURNINX</text>
</svg>
