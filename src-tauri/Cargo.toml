[package]
name = "burninx"
version = "2.8.0"
description = "GPU, CPU and RAM Hardware Stress Test Utility for Windows"
authors = ["BurnInX Team"]
edition = "2021"

[lib]
name = "burninx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
